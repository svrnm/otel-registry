name: Check

on:
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # Options that are already marked and tracked do not block someone editing the same file.
      - name: Read what the tracking issue already lists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh issue list --state open --search '"Marked entries" in:title author:app/github-actions' --json body --jq '.[0].body // ""' > "$RUNNER_TEMP/marked.md"
      - name: Check entries (a new finding in a changed file fails the pull request)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only -z --diff-filter=AM "origin/$BASE_REF...HEAD" -- data \
            | xargs -0 npm run data -- --baseline "$RUNNER_TEMP/marked.md" --changed
      - run: npx astro build
