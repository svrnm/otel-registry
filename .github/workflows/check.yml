name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check entries (a finding in a changed file fails the pull request)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only -z --diff-filter=AM "origin/$BASE_REF...HEAD" -- data \
            | xargs -0 npm run data -- --changed
      - run: npx astro build
