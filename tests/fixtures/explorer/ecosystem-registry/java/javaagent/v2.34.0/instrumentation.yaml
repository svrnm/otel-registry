file_format: 0.8
libraries:
  - name: jdbc
    display_name: JDBC
    description: >-
      This instrumentation enables database client spans and database client
      metrics for JDBC operations. There is also a datasource instrumentation
      that creates spans for datasource connections (disabled by default). Note:
      The instrumentation unwraps pooled connections to cache metadata against
      the underlying physical connection; without proper unwrapping, repeated
      metadata extraction can cause performance degradation.
    library_link: https://docs.oracle.com/javase/8/docs/api/java/sql/package-summary.html
    source_path: instrumentation/jdbc
  - name: spring-webmvc-3.1
    display_name: Spring WebMVC
    description: >-
      This instrumentation enriches HTTP server spans with route information for
      Spring WebMVC 3.1+. It also enables controller spans (controller spans are
      disabled by default) and view spans (view spans are disabled by default).
    library_link: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/servlet/mvc/package-summary.html
    source_path: instrumentation/spring/spring-webmvc/spring-webmvc-3.1
  - name: spring-webmvc-6.0
    display_name: Spring WebMVC
    description: >-
      This instrumentation enriches HTTP server spans with route information for
      Spring WebMVC 6.0+. It also enables controller spans (controller spans are
      disabled by default) and view spans (view spans are disabled by default).
    library_link: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/servlet/mvc/package-summary.html
    source_path: instrumentation/spring/spring-webmvc/spring-webmvc-6.0
