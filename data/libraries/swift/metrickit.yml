name: MetricKit
options:
  - tier: otel
    repo: https://github.com/open-telemetry/opentelemetry-swift/tree/main/Sources/Instrumentation/MetricKit
    note: This instrumentation adds MetricKit signals to OpenTelemetry, capturing performance metrics and diagnostic data from Apple's MetricKit framework. MetricKit provides aggregated data about your app's performance and diagnostics, reported approximately once per day with cumulative data from the previous 24-hour period.
